syntax = "proto3";

package kv;

// A single storage node's key-value API, exposed over gRPC.
service KeyValueStore {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Liveness probe used by the coordinator's health checker. Doesn't touch
  // the store -- a successful response just means this node's gRPC server
  // is up and responsive.
  rpc Ping(PingRequest) returns (PingResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  string value = 2;
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool success = 1;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool existed = 1;
}

message PingRequest {}

message PingResponse {
  bool ok = 1;
}
