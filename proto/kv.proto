syntax = "proto3";

package kv;

// KVStore is implemented by every storage node. The coordinator (linked into
// the client and benchmark binaries) talks to this service over real gRPC/TCP.
service KVStore {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Used by the coordinator's background health-checker to detect node
  // failure/recovery for automatic failover.
  rpc Ping(PingRequest) returns (PingResponse);
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  string value = 2;
}

message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool success = 1;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
  bool existed = 2;
}

message PingRequest {}

message PingResponse {
  string node_id = 1;
}
